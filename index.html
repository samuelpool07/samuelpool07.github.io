<html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de los Contadores</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #263b55;
            margin-bottom: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .alumno {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .alumno img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .alumno h3 {
            color: #263b55;
            font-size: 15px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h1>Álbum de los bellakos</h1>

    <div class="galeria">

        <div class="alumno">
            <img src="https://raw.githubusercontent.com/samuelpool07/samuelpool07.github.io/fe5790b7c75c997adc095cd386a6bf3652c2cba4/imagenes/CHAN%20RODRIGUEZ%20ANGELES%20GUADALUPE.jpeg"
                 alt="Chan Rodríguez Ángeles Guadalupe">
            <h3>CHAN RODRÍGUEZ ÁNGELES GUADALUPE</h3>
        </div>

        <div class="alumno">
            <img src="https://raw.githubusercontent.com/samuelpool07/samuelpool07.github.io/fe5790b7c75c997adc095cd386a6bf3652c2cba4/imagenes/POOL%20CANUL%20ESTEFANY%20YOSELIN.jpeg"
                 alt="Pool Canul Estefany Yoselin">
            <h3>POOL CANUL ESTEFANY YOSELIN</h3>
        </div>

        <div class="alumno">
            <img src="https://raw.githubusercontent.com/samuelpool07/samuelpool07.github.io/fe5790b7c75c997adc095cd386a6bf3652c2cba4/imagenes/POOL%20COB%20SAMUEL%20OBED.jpeg"
                 alt="Pool Cob Samuel Obed">
            <h3>POOL COB SAMUEL OBED</h3>
        </div>

        <div class="alumno">
            <img src="https://raw.githubusercontent.com/samuelpool07/samuelpool07.github.io/fe5790b7c75c997adc095cd386a6bf3652c2cba4/imagenes/SIMA%20CARRILLO%20ROBERTO%20ISRAEL.jpeg"
                 alt="Sima Carrillo Roberto Israel">
            <h3>SIMA CARRILLO ROBERTO ISRAEL</h3>
        </div>

        <div class="alumno">
            <img src="https://raw.githubusercontent.com/samuelpool07/samuelpool07.github.io/fe5790b7c75c997adc095cd386a6bf3652c2cba4/imagenes/TUN%20CHIQUIL%20JULIO%20CESAR.jpeg"
                 alt="Tun Chiquil Julio César">
            <h3>TUN CHIQUIL JULIO CÉSAR</h3>
        </div>

    </div>

</body>
</html>
